<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Daniela Rico Iglesias</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/HDV_Daniela_Rico/assets/img/favicon.ico" sizes="any">
<!-- GitHub Pages sirve esta página en cualquier ruta inexistente: por eso las rutas son absolutas -->
<style>
@font-face{ font-family:'Fraunces'; font-style:normal; font-weight:100 900; font-display:swap; src:url(/HDV_Daniela_Rico/assets/fonts/fraunces.woff2) format('woff2'); }
@font-face{ font-family:'Fraunces'; font-style:italic; font-weight:100 900; font-display:swap; src:url(/HDV_Daniela_Rico/assets/fonts/fraunces-italic.woff2) format('woff2'); }
@font-face{ font-family:'Plus Jakarta Sans'; font-style:normal; font-weight:200 800; font-display:swap; src:url(/HDV_Daniela_Rico/assets/fonts/plus-jakarta-sans.woff2) format('woff2'); }
:root{ --paper:#FBF8F4; --ink:#231A25; --ink-2:#554A57; --rose:#A23B5B; --line:rgba(35,26,37,.14); color-scheme:light dark; }
@media (prefers-color-scheme: dark){ :root{ --paper:#141015; --ink:#F3ECEF; --ink-2:#C8BCC5; --rose:#E58CA6; --line:rgba(243,236,239,.18); } }
*{ box-sizing:border-box; margin:0; }
body{
  min-height:100vh; display:grid; place-items:center; padding:32px 20px;
  font-family:'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
main{ max-width:560px; text-align:center; }
.cl{
  display:inline-block; padding:3px 12px 2px; border-radius:999px; border:1px solid var(--line);
  font-family:'Fraunces', Georgia, serif; font-style:italic; color:var(--rose); font-size:1.05rem;
}
h1{
  margin-top:22px; font-family:'Fraunces', Georgia, serif; font-weight:340; letter-spacing:-.03em;
  font-size:clamp(2.4rem, 8vw, 3.6rem); line-height:1.02;
}
h1 em{ display:block; font-style:italic; color:var(--rose); }
dl{ margin:30px auto 0; text-align:left; display:grid; gap:12px; max-width:440px; }
dt{ font-size:.7rem; font-weight:750; letter-spacing:.17em; text-transform:uppercase; color:var(--ink-2); }
dd{ margin-top:2px; color:var(--ink-2); line-height:1.6; }
a{
  display:inline-flex; margin-top:34px; padding:13px 24px; border-radius:999px;
  background:var(--rose); color:var(--paper); font-weight:650; text-decoration:none;
}
a:focus-visible{ outline:2px solid var(--rose); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <p class="cl">§ 10.2 · No conformidad</p>
  <h1>Esta página <em>no existe.</em></h1>
  <dl>
    <div><dt>Hallazgo</dt><dd>La dirección solicitada no corresponde a ninguna página del sitio.</dd></div>
    <div><dt>Acción correctiva</dt><dd>Volver al inicio, donde está toda la hoja de vida.</dd></div>
  </dl>
  <a href="/HDV_Daniela_Rico/">Ir al inicio</a>
</main>
</body>
</html>
